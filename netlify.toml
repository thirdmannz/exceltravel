[build.environment]
  NODE_VERSION = "20"

# Static asset caching. Netlify's CDN already compresses text responses,
# so these headers only control how long the browser may reuse them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images and the brand icon are the heaviest assets (assets/ totals ~10 MB);
# they change rarely, so let the browser keep them for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML/CSS/JS must revalidate so a deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# API responses are per-user and must never be cached by a shared proxy.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
