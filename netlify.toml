[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/data/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "20"
