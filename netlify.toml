[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Legacy Wix service URLs: preserve indexed links while moving booking ownership to this site.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/data/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200

