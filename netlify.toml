[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # default zisi bundler: Netlify natively detects @netlify/blobs and injects
  # NETLIFY_BLOBS_CONTEXT at build time (esbuild bundling can miss it)

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/data/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "20"
